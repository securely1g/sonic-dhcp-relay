name: Bazel AMD64 source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Explicitly test the PR head, including forks; never base-only.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
      - name: Install verified project-local Bazel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relay-tools"
          curl --fail --location --retry 3 https://releases.bazel.build/8.5.1/release/bazel-8.5.1-linux-x86_64 -o "$RUNNER_TEMP/relay-tools/bazel"
          echo '61d89402f0368e64b6c827be5de79d8e65382e8124c3cbb97325611a1851392e  '"$RUNNER_TEMP/relay-tools/bazel" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/relay-tools/bazel"
      - name: Build and execute declared source gates
        env:
          BAZEL: ${{ runner.temp }}/relay-tools/bazel
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_STATE: ${{ runner.temp }}/relay-bazel
          CI_EVIDENCE: ${{ github.workspace }}/ci-evidence
        run: bash tools/bazel/ci.sh
      - name: Preserve receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 14
